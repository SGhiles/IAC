---
- name: Installer ufw
  ansible.builtin.package:
    name: ufw
    state: present
  become: true

- name: Definir la politique par defaut entrante
  community.general.ufw:
    direction: incoming
    policy: "{{ ufw_default_incoming }}"
  become: true
  notify: reload ufw

- name: Definir la politique par defaut sortante
  community.general.ufw:
    direction: outgoing
    policy: "{{ ufw_default_outgoing }}"
  become: true
  notify: reload ufw

- name: Autoriser les ports necessaires
  community.general.ufw:
    rule: allow
    port: "{{ item }}"
    proto: tcp
  loop: "{{ ufw_allowed_ports }}"
  become: true
  notify: reload ufw

- name: Activer ufw
  community.general.ufw:
    state: enabled
  become: true
