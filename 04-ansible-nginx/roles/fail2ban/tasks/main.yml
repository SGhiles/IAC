---
- name: Installer fail2ban
  ansible.builtin.package:
    name: fail2ban
    state: present
  become: true

- name: Deployer la configuration jail.local (Jinja2)
  ansible.builtin.template:
    src: jail.local.j2
    dest: /etc/fail2ban/jail.local
    mode: "0644"
  become: true
  notify: restart fail2ban

- name: Demarrer et activer fail2ban
  ansible.builtin.service:
    name: fail2ban
    state: started
    enabled: true
  become: true
