---
- name: Installer nginx
  ansible.builtin.package:
    name: nginx
    state: present
  become: true

- name: Desactiver le site nginx par defaut
  ansible.builtin.file:
    path: /etc/nginx/sites-enabled/default
    state: absent
  become: true
  notify: restart nginx

- name: Deployer le fichier de configuration nginx (Jinja2)
  ansible.builtin.template:
    src: nginx.conf.j2
    dest: /etc/nginx/conf.d/site.conf
    mode: "0644"
  become: true
  notify: restart nginx

- name: Deployer la page web (Jinja2)
  ansible.builtin.template:
    src: index.html.j2
    dest: "{{ nginx_root }}/index.html"
    mode: "0644"
  become: true

- name: Demarrer et activer nginx
  ansible.builtin.service:
    name: nginx
    state: started
    enabled: true
  become: true
